apiVersion: apps/v1
kind: Deployment
metadata:
  name: arsipin
  namespace: arsipin-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: arsipin
  template:
    metadata:
      labels:
        app: arsipin
    spec:
      containers:
        - name: arsipin-frontend
          image: arsipin:0.1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
